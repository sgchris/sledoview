#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.
#
# SECURITY NOTES:
# * The release token is only present in two minimal jobs below
#   ("create-release" and "host"). Those jobs perform only hosting calls
#   and file reads; they contain no installer downloads, no step-result
#   writes, and no scratch-storage uploads.
# * Installers are never piped into a shell. The packager is built from
#   source with the Rust toolchain, which is provided by the runner image
#   or by a pinned toolchain action.
# * Planning publishes only the build matrix and run-mode fields (not the
#   whole manifest), and planning/building run without any token, so
#   results, logs, and stored files in those jobs cannot carry credentials.
# * Stored files use static paths limited to manifests and the build output
#   directory, with short retention. No home-directory or credential paths
#   are stored.
# * Every third-party action is pinned to a full commit SHA (version kept
#   in a trailing comment).

name: Release
permissions: {}
# deny-by-default; each job declares its own least privilege below

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' to determine what tasks we need to do.
  # Token-free: planning needs no hosting access, so this job carries no
  # credentials and its results, logs, and stored files are credential-free.
  plan:
    permissions:
      contents: read
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pr-mode: ${{ steps.plan.outputs.pr_mode }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # Built from source with the preinstalled Rust toolchain so this
        # step performs no remote-script execution.
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-dist --version 0.29.0 --locked --force
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but credentials are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs credentials to work right.)
      - name: Run dist plan
        # No credentials here on purpose: `dist plan` is a local computation.
        # Release creation happens in the dedicated create-release job below.
        run: |
          set -euo pipefail
          dist plan --output-format=json > plan-dist-manifest.json
      - id: plan
        # Credential-free step: publishes only the two machine-readable
        # fields the builds need, not the whole manifest.
        run: |
          set -euo pipefail
          echo "matrix=$(jq -c '.ci.github.artifacts_matrix' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "pr_mode=$(jq -r '.ci.github.pr_run_mode // ""' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        # Credential-free job, so stored files cannot carry credentials.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json
          if-no-files-found: error
          retention-days: 7

  # Create the hosting release entry. This is the only planning-side job
  # that carries credentials, kept minimal: no installer downloads beyond
  # the source build, no step-result writes, no scratch-storage traffic.
  create-release:
    permissions:
      contents: write
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # Same source build as the plan job; no remote-script execution.
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-dist --version 0.29.0 --locked --force
      - name: Create hosting release entry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          dist host --steps=create --tag="$RELEASE_TAG" --output-format=json > dist-manifest.json

  # Build and packages all the platform-specific things.
  # Token-free: local compilation only, so results and stored files are
  # credential-free even though build instructions come from the plan.
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    permissions:
      contents: read
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.matrix).include != null && (needs.plan.outputs.publishing == 'true' || needs.plan.outputs.pr-mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    # No credentials in this job: `dist build` is local-only.
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Rust toolchain if not already installed
        if: ${{ matrix.container }}
        # Pinned toolchain action instead of a remote install script.
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Install dist
        # Source build; runs with no credentials in scope. The generated
        # per-platform installer snippet is intentionally not executed, so
        # untrusted plan data cannot drive remote-script execution.
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-dist --version 0.29.0 --locked --force
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        env:
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          set -euo pipefail
          # Local build only — intentionally credential-free.
          if [ -n "$DIST_TAG_FLAG" ]; then
            dist build "$DIST_TAG_FLAG" --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          else
            dist build --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          fi
      - name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          set -euo pipefail
          # Stage the manifest next to the built files; the whole output
          # directory is stored as one static path below.
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        # Credential-free job; only the static build output directory.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: target/distrib/
          if-no-files-found: error
          retention-days: 7

  # Build and package all the platform-agnostic(ish) things.
  # Token-free like the local builds.
  build-global-artifacts:
    permissions:
      contents: read
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    timeout-minutes: 15
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    # No credentials in this job; global build is local-only.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # Same source build; no remote-script execution.
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-dist --version 0.29.0 --locked --force
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Stage global manifest
        shell: bash
        env:
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          set -euo pipefail
          # Local build only — intentionally credential-free.
          if [ -n "$DIST_TAG_FLAG" ]; then
            dist build "$DIST_TAG_FLAG" --output-format=json "--artifacts=global" > dist-manifest.json
          else
            dist build --output-format=json "--artifacts=global" > dist-manifest.json
          fi

          # Stage the manifest next to the built files; the whole output
          # directory is stored as one static path below.
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-build-global
          path: target/distrib/
          if-no-files-found: error
          retention-days: 7
  # Determines if we should publish/announce.
  # Credential-bearing but minimal: hosting calls and file reads only.
  # No step-result writes and no scratch-storage uploads in this job.
  host:
    permissions:
      contents: write
    needs:
      - plan
      - create-release
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.outputs.publishing == 'true' && needs.create-release.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # Same source build; no remote-script execution, no credentials.
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-dist --version 0.29.0 --locked --force
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Run dist host upload and release
        shell: bash
        env:
          # Hosting call scoped to this step only.
          GH_TOKEN: ${{ github.token }}
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          set -euo pipefail
          if [ -n "$DIST_TAG_FLAG" ]; then
            dist host "$DIST_TAG_FLAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          else
            dist host --steps=upload --steps=release --output-format=json > dist-manifest.json
          fi
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Prepare release notes
        # Credential-free: announcement text is staged to temp files here so
        # the publishing step below only reads files.
        run: |
          set -euo pipefail
          jq -r '.announcement_github_body // ""' dist-manifest.json > "$RUNNER_TEMP/notes.txt"
          jq -r '.announcement_title // ""' dist-manifest.json > "$RUNNER_TEMP/title.txt"
          jq -r '.announcement_is_prerelease' dist-manifest.json > "$RUNNER_TEMP/prerelease.txt"
      - name: Create GitHub Release
        env:
          # Publishing call scoped to this step only; inputs are plain
          # refs, and the announcement text comes from staged temp files.
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          set -euo pipefail
          TITLE="$(cat "$RUNNER_TEMP/title.txt")"
          if [ "$(cat "$RUNNER_TEMP/prerelease.txt")" = "true" ]; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --prerelease --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
          fi

  announce:
    permissions:
      contents: read
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    # Credential-free: this job only checks out.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
